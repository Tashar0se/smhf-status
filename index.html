  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

  #gate img{width:64px;height:64px;border-radius:16px;margin-bottom:14px}
  #gate h1{font-size:18px;margin:0 0 4px}

  #gate input{width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;text-align:center;
    border:1px solid #35506b;border-radius:10px;background:transparent;color:inherit;margin-bottom:10px}
  #gate button{width:100%;padding:13px;font-size:15px;font-weight:700;border:0;border-radius:10px;

  #gate .err{color:#e0685f;font-size:13px;min-height:18px;margin-top:8px}
</style>

const KEY = "smhf_pc";
const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pass){
  const salt = dec(DATA.s), iv = dec(DATA.i), ct = dec(DATA.c);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass),
    "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:DATA.n, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return new TextDecoder().decode(pt);
}
async function tryPass(pass, remember){
  try{
    const html = await unlock(pass);
    document.open(); document.write(html); document.close();
    if(remember) localStorage.setItem(KEY, pass);
    return true;
  }catch(e){ return false; }
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pc = document.getElementById("pc").value;
  const ok = await tryPass(pc, true);
  if(!ok) document.getElementById("err").textContent = "Wrong passcode — try again.";
});
