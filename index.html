<style>
  html,body{margin:0;background:#0e1620;color:#e8eef4;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
  @media (prefers-color-scheme: light){html,body{background:#f4f6f8;color:#16324f}}
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #gate .box{width:100%;max-width:320px;text-align:center}
  #gate img{width:64px;height:64px;border-radius:16px;margin-bottom:14px}
  #gate h1{font-size:18px;margin:0 0 4px}
  #gate p{font-size:13px;opacity:.6;margin:0 0 18px}
  #gate input{width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;text-align:center;
    border:1px solid #35506b;border-radius:10px;background:transparent;color:inherit;margin-bottom:10px}
  #gate button{width:100%;padding:13px;font-size:15px;font-weight:700;border:0;border-radius:10px;
    background:#16324f;color:#fff}
  #gate .err{color:#e0685f;font-size:13px;min-height:18px;margin-top:8px}
</style>

</form></div>

  }catch(e){ return false; }
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pc = document.getElementById("pc").value;
  const ok = await tryPass(pc, true);
  if(!ok) document.getElementById("err").textContent = "Wrong passcode — try again.";
});
(async () => {
  const saved = localStorage.getItem(KEY);
  if(saved){ const ok = await tryPass(saved, false); if(!ok) localStorage.removeItem(KEY); }
})();
</script>
